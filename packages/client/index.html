<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Poker</title>
    <style>
      :root {
        --felt: #0b3d2e;
        --gold: #f5d47a;
        --ink: #ffffff;
        --muted: #a8ccbf;
        --danger: #ff8a80;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--felt);
        overflow: hidden;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }

      #game {
        width: 100%;
        height: 100%;
      }

      /*
       * DOM overlay for screens that need real text inputs (native keyboard on
       * mobile, and later inside Capacitor). It covers the whole viewport rather
       * than tracking the letterboxed canvas, so anything that must line up with
       * these controls belongs in here too — not drawn in Phaser. Mixing the two
       * puts them in different coordinate systems and they overlap once the
       * canvas gets letterboxed on a phone.
       */
      #ui-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        display: none;
        pointer-events: none;
        /*
         * The scroll container, and it must be sized in dvh.
         *
         * `inset: 0` (or 100vh) resolves against the LARGE viewport — the height
         * the page would have with the browser chrome hidden. On a phone the
         * address bar and toolbars are really there, so the box ends up taller
         * than what the player can see, the content fits that phantom height,
         * scrollHeight equals clientHeight, and the browser sees nothing to
         * scroll — while the bottom of the form sits behind the chrome,
         * unreachable. Landscape makes it obvious because the chrome eats a big
         * share of an already short viewport.
         *
         * dvh tracks the chrome as it shows and hides, so overflow is real.
         */
        height: 100vh; /* oldest fallback */
        height: 100dvh; /* Safari 15.4+ / Chrome 108+ */
        /* Measured from visualViewport — see services/viewport-height.ts. */
        height: var(--app-height, 100dvh);
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        /* Keep vertical panning available and stop the scroll from chaining to the page. */
        touch-action: pan-y;
        overscroll-behavior: contain;
      }
      #ui-overlay.active {
        display: block;
        pointer-events: auto;
      }

      /* Grows with its content; centers while it still fits, scrolls once it doesn't. */
      .screen {
        box-sizing: border-box;
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(16px, 5vh, 40px);
        padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      }

      .brand {
        margin: 0;
        font-size: clamp(40px, 13vw, 72px);
        line-height: 1;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--gold);
        text-align: center;
        text-shadow: 0 2px 12px rgba(0, 0, 0, 0.5);
      }

      .card {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: min(360px, 100%);
        padding: clamp(20px, 5vw, 28px);
        background: rgba(0, 0, 0, 0.55);
        border-radius: 14px;
        color: var(--ink);
      }

      .mode-switch {
        display: flex;
        gap: 8px;
      }
      .mode-btn {
        flex: 1;
        padding: 10px;
        font-size: 15px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
        cursor: pointer;
      }
      .mode-btn[aria-pressed='true'] {
        color: var(--felt);
        background: var(--gold);
        border-color: var(--gold);
        font-weight: 700;
      }

      .card input {
        box-sizing: border-box;
        width: 100%;
        padding: 12px;
        /* 16px keeps iOS Safari from zooming in when a field takes focus. */
        font-size: 16px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
      }
      .card input::placeholder {
        color: var(--muted);
      }
      .card input:focus {
        outline: 2px solid var(--gold);
        outline-offset: 1px;
      }

      .submit-btn {
        padding: 14px;
        font-size: 16px;
        font-weight: 700;
        color: var(--felt);
        background: var(--gold);
        border: 0;
        border-radius: 8px;
        cursor: pointer;
      }
      .submit-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }

      .form-error {
        margin: 0;
        min-height: 18px;
        font-size: 13px;
        color: var(--danger);
      }

      /* Landscape phones and open keyboards: shrink the title so the form still fits. */
      @media (max-height: 480px) {
        .brand {
          font-size: clamp(28px, 7vh, 40px);
        }
        .screen {
          gap: 12px;
          padding-top: 12px;
          padding-bottom: 12px;
        }
        .card {
          gap: 8px;
          padding: 16px;
        }
      }

      /*
       * Below this the title is the difference between the form fitting and the
       * player having to scroll a login box. The fields are self-explanatory and
       * scrolling still works for the taller registration form, so drop it.
       * Touch targets stay at their full size — those are not worth shrinking.
       */
      @media (max-height: 400px) {
        .brand {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui-overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
