<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Poker</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0b3d2e;
        overflow: hidden;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* DOM overlay used by LoginScene — Phaser draws the canvas underneath. */
      #ui-overlay {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
      }
      #ui-overlay.active {
        display: flex;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui-overlay"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
